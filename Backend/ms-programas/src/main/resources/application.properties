spring.application.name=ms-programas
server.port=8082

# Conexion al MySQL de XAMPP (MariaDB).
# Si la base no existe, se crea al arrancar.
spring.datasource.url=jdbc:mariadb://localhost:3306/corpaliv_programas?createDatabaseIfNotExist=true

# Usuario y clave: se leen de variables de entorno.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea o actualiza las tablas segun las entidades.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que ejecuta Hibernate.
spring.jpa.show-sql=true

# Cierra la conexion a la BD al terminar cada consulta.
spring.jpa.open-in-view=false

# Ejecuta data.sql en cada arranque.
spring.sql.init.mode=always

# Espera a que Hibernate cree las tablas antes de ejecutar data.sql.
spring.jpa.defer-datasource-initialization=true

# Codificacion UTF-8 para conservar tildes y caracteres especiales.
spring.sql.init.encoding=UTF-8
