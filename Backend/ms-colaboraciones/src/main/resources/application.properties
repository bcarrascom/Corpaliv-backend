spring.application.name=ms-colaboraciones
server.port=8083

# Conexion al MySQL de XAMPP (que en realidad es MariaDB, por eso el driver y la URL "mariadb").
# Si la base no existe, se crea al arrancar.
spring.datasource.url=jdbc:mariadb://localhost:3306/corpaliv_colaboraciones?createDatabaseIfNotExist=true
# Usuario y clave: se leen de variables de entorno; si no existen, root sin clave (XAMPP).
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea o actualiza las tablas segun las entidades, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que ejecuta Hibernate.
spring.jpa.show-sql=true
# Cierra la conexion a la BD al terminar cada consulta, no al terminar la respuesta HTTP.
spring.jpa.open-in-view=false

# Datos iniciales: ejecuta data.sql en cada arranque (es seguro: usa INSERT IGNORE).
spring.sql.init.mode=always
# Espera a que Hibernate cree las tablas antes de ejecutar data.sql.
spring.jpa.defer-datasource-initialization=true
# Lee data.sql como UTF-8 para que las tildes lleguen bien en cualquier PC.
spring.sql.init.encoding=UTF-8
