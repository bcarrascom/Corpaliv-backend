spring.application.name=ms-productos
server.port=8081

# Conexion a MySQL de XAMPP. Si la base no existe, se crea al arrancar.
spring.datasource.url=jdbc:mysql://localhost:3306/corpaliv_productos?createDatabaseIfNotExist=true
# Usuario y clave: se leen de variables de entorno; si no existen, root sin clave (XAMPP).
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# XAMPP trae MariaDB; se indica para que Hibernate genere el SQL correcto.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Hibernate crea o actualiza las tablas segun las entidades, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que ejecuta Hibernate.
spring.jpa.show-sql=true
# Cierra la conexion a la BD al terminar cada consulta, no al terminar la respuesta HTTP.
spring.jpa.open-in-view=false
